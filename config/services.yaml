services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $bundleConfig: '%huh_media_library%'

    _instanceof:
        HeimrichHannot\MediaLibraryBundle\ArchiveType\AbstractArchiveType:
            tags: ['huh.media_library.archive_type']

    Psr\Log\LoggerInterface:
        alias: monolog.logger.contao

    HeimrichHannot\MediaLibraryBundle\:
        resource: ../src
        exclude:
            - ../src/{Contao,ContaoManager,DependencyInjection,Model}
            - ../src/Product/Product.php

    HeimrichHannot\MediaLibraryBundle\Migration\RenameProductTablesMigration:
        tags:
            - { name: contao.migration, priority: 200 }

    HeimrichHannot\MediaLibraryBundle\Migration\RenameColumnsMigration:
        tags:
            - { name: contao.migration, priority: 50 }

    HeimrichHannot\MediaLibraryBundle\DataContainer\:
        resource: '../src/DataContainer'
        public: true

    # todo(@ericges): remove this when the ajax manager has been removed from the bundle
    huh.media_library.ajax_manager:
        public: true
        class: HeimrichHannot\MediaLibraryBundle\Manager\AjaxManager
        arguments:
            - "@contao.framework"
            - "@translator"
            - "@huh.utils.file"
            - "@huh.ajax"
